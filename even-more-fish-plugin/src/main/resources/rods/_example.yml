# This file contains all valid configuration for custom rods.
# Do not edit this file. It will be reset every time the plugin reloads.

# The ID for this rod, this is required and must be unique to other rods.
id: exampleRod

# Should this rod be disabled?
disabled: false

# Which rarities can this rod catch?
allowed-rarities:
  - Common
  - Junk
  - Rare
  - Epic
  - Legendary

# Custom rod attributes & stats
stats:
  luck-modifier: 0.25         # +25% chance for rarer fish
  lure-modifier: 0.20         # 20% reduction in fishing wait time
  double-catch-chance: 0.10   # 10% chance to duplicate caught fish
  exp-multiplier: 1.25        # 1.25x EXP multiplier
  rarity-modifiers:
    Legendary: 1.5            # 1.5x weight multiplier for Legendary rarity
    Epic: 1.3

# Whether baits can be attached to this custom rod
allow-baits: true

# Whether the rod is unbreakable
unbreakable: false

# What should the rod look like?
item:
  material: FISHING_ROD
  displayname: "<gold><bold>Cần Câu Hoàng Kim</gold>"
  glowing: true
  lore:
    - ' '
    - '<dark_gray> ○ <white>Độ hiếm: <gold>Hoàng Kim</gold>'
    - '<dark_gray> ○ <white>Tương thích mồi: <green>Có</green>'
    - ' '
    - '<dark_gray> ○ <white>Tăng sức mạnh:'
    - '  <dark_gray> -<yellow> May Mắn:</yellow> <green>+25%</green>'
    - '  <dark_gray> -<aqua> Tốc Độ Cắn Câu:</aqua> <green>+20%</green>'
    - '  <dark_gray> -<light_purple> Nhân Đôi Cá:</light_purple> <green>10%</green>'
    - '  <dark_gray> -<gold> Kinh Nghiệm (EXP):</gold> <green>x1.25</green>'
    - ' '
    - '<#C797FF>Sử dụng cần câu này'
    - '<white>để thử vận may!'

# Should this rod have a recipe?
recipe:
  type: shaped
  shape:
    - aaa
    - dfd
    - aaa
  ingredients:
    a: air
    d: diamond
    f: fishing_rod