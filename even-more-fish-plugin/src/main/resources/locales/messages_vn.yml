#If a message contains EvenMoreFish placeholders, e.g. {player} or {rarity} it also supports placeholderapi placeholders.
#Sent to players when they fish an EvenMoreFish fish
fish-caught: <gradient:#E6F9FF:#8FD9FB>[EvenMoreFish]</gradient> <white><b>{player}</b></white> <gray>đã câu được</gray> {rarity} {fish} <gray>dài</gray> <#A8D8EA>{length}cm</#A8D8EA>!
#By setting a fish's minimum-length to less than 0, you can create a lengthless fish. This is used when a player fishes a lengthless fish.
lengthless-fish-caught: '<#57C7FF>{player} <#BFC7D5>đã câu được <white>{rarity} {fish}!'
#Sent to a player when they don't have permission to execute a command.
no-permission: '<#FF5A6E>bạn không có quyền để chạy lệnh này.'
#The message to be sent when a competition starts and ends
contest-start: '<#BFC7D5><reset>Cuộc thi câu cá xếp hạng <white>{type}<#BFC7D5> đã bắt đầu.'
contest-end: '<#BFC7D5><reset>Cuộc thi câu cá đã kết thúc.'
#The message to be sent when a player joins whilst a competition is going on
contest-join: '<#BFC7D5><reset>Cuộc thi câu cá hạng <white>{type}<#BFC7D5> đang diễn ra.'
#Shown to players when a new player takes #1 spot, remove this value or set it to "" to disable this message
new-first: '<#BFC7D5><reset><#57C7FF>{player}<#BFC7D5> đang TOP #1'
#Should this message appear in chat (false) or above the exp bar (true)
action-bar-message: true
#What competition types should the action bar be used for? (recommended: MOST_FISH)
action-bar-types:
  - MOST_FISH
#What should replace the {type} variable for each competition type?
competition-types:
  #MOST_FISH
  most: '<#BFC7D5>nhiều cá nhất'
  #LARGEST_FISH
  largest: '<#BFC7D5>cá to nhất'
  #LARGEST_TOTAL_FISH
  largest-total: '<#BFC7D5>tổng chiều dài cá lớn nhất'
  #SPECIFIC_FISH
  specific: '<white>{amount} {rarity} {fish}<#BFC7D5><reset>'
  #SPECIFIC_RARITY
  specific-rarity: '<white>{amount} {rarity_colour}{rarity}<#BFC7D5><reset> cá'
#Segments shown in the bossbar when competitions run
bossbar:
  layout: '{prefix}<reset>{time-formatted}<reset>{remaining}'
  #The abbreviations used for different units of time
  hour: <reset>{hour}h
  minute: <reset>{minute}m
  second: <reset>{second}s
  #For translating the "left" at the end e.g. "5s left" -> "5s kvar"
  remaining: còn lại

#The colour of the [EvenMoreFish] prefix in commands (for when your prefix doesn't have colours)
prefix-regular: '<green>[EvenMoreFish] '
#The colour of the [EvenMoreFish] prefix in admin commands (for when your prefix doesn't have colours)
prefix-admin: '<red>[EvenMoreFish] '
#The colour of the [EvenMoreFish] prefix when errors occur e.g. no permission to run a command (for when your prefix doesn't have colours)
prefix-error: '<red>[EvenMoreFish] '

#This is the format of the lore given to fish when they're caught.
#{custom-lore} is specified in the fish.yml under the lore: section, if the fish has a lore, the lore's lines will
#replace the {fish_lore}, however if it's empty the line will be removed. DO NOT ADD ANYTHING OTHER THAN THIS VARIABLE
#TO THAT LINE.
fish-lore:
  - '<#BFC7D5>Bắt bởi <#57C7FF>{player}'
  - '<#BFC7D5>Dài <white>{length}<#BFC7D5> cm'
  - ''
  - '<white>{fish_lore}'
  - '<white>{rarity_colour}{rarity}'
#The format of commands in /emf help (this message doesn't support papi placeholders)
help: '<#BFC7D5>/<white>{command}<#BFC7D5> - <white>{description}'
#The format of the leaderboard after a competition is over (this message doesn't support papi placeholders)
leaderboard-largest-fish: '<#BFC7D5><reset><white>#{position}<#BFC7D5> | <#57C7FF>{player}<#BFC7D5> <reset>(<white>{rarity} {fish}<#BFC7D5><reset>, <white>{length}<#BFC7D5>cm<reset>)'
leaderboard-largest-total: '<#BFC7D5><reset><white>#{position}<#BFC7D5> | <#57C7FF>{player}<#BFC7D5> <reset>(<white>{amount}<#BFC7D5> cm<reset>)'
leaderboard-most-fish: '<#BFC7D5><reset><white>#{position}<#BFC7D5> | <#57C7FF>{player}<#BFC7D5> <reset>(<white>{amount}<#BFC7D5> <reset>fish)'
#If you're running a competition where there's no leaderboard, this message is sent when there's a winner
single-winner: '<#BFC7D5><reset><#57C7FF>{player}<#BFC7D5> đã thắng cuộc thi câu cá xếp hạng <white>{type}<#BFC7D5>. Chúc mừng!'
#This shows the number of players currently in the competition, set to "" to disable.
total-players: '<#BFC7D5><reset>Có tổng cộng <white>{amount}<#BFC7D5> người chơi trên top'
#The number of positions shown in the leaderboard - can't be less than 1.
leaderboard-count: 5
#If the player doesn't appear on /emf top, should their position be displayed at the bottom?
always-show-pos: true
#Sent to players when nobody got a record during a competition
no-winners: '<#BFC7D5><reset>Không ai có TOP trong cuộc thi câu cá.'
#When an individual player didn't get a record
no-record: '<#BFC7D5><reset>Bạn chưa câu con cá nào cả.'
#Sent when an admin tries to start a competition where the type doesn't exist e.g. /emf admin competition start 600 ABCDEFGH
invalid-type: '<#FF5A6E><reset>Đó không phải xếp hạng cuộc thi đúng, các xếp hạng có sẵn: MOST_FISH, LARGEST_FISH, SPECIFIC_FISH'
#Sent to all online players when not enough players are on to start a competition
not-enough-players: '<#BFC7D5><reset>Không có đủ người chơi online để bắt đầu cuộc thi câu cá.'
#Sent to all players at specific times to show the remaining time left
#{time_formatted} shows the time (e.g. 5m left, 10m 30s left)
#{time_raw} is what you input in competitions.yml
time-alert: '<#BFC7D5><reset>Còn <#5899ee>{time_formatted}<#BFC7D5> cho cuộc thi câu cá xếp hạng <white>{type}'
#The message sent to players when they've sold their fish in the /emf shop
fish-sale: '<#55D68A>Bạn đã bán <white>{amount} cá với giá {sell-price}.'
#Help messages
#General help (/emf help) - permission node dependant commands will only show if they are formatted with the forward-slash.
help-general:
  title: "<#BFC7D5>Hướng dẫn câu cá"
  top: "<#BFC7D5>Xem cuộc thi đang diễn ra và hạng của bạn."
  help: "<#BFC7D5>Xem các lệnh câu cá dành cho bạn."
  shop: "<#BFC7D5>Mở cửa hàng bán cá."
  toggle: "<#BFC7D5>Bật hoặc tắt cá tùy chỉnh và bossbar."
  gui: "[noPrefix]Mở giao diện câu cá."
  admin: "<#BFC7D5>Xem lệnh quản trị (cần quyền admin)."
  sellall: "<#BFC7D5>Bán toàn bộ cá hợp lệ trong túi đồ."
  next: "[noPrefix]Xem thời gian cuộc thi tiếp theo."
  applybaits: "<#BFC7D5>Gắn mồi vào cần câu."
  journal: "<#BFC7D5>Xem nhật ký cá đã bắt."
help-competition:
  start: "<#BFC7D5>Bắt đầu cuộc thi đã cấu hình."
  end: "<#BFC7D5>Kết thúc cuộc thi hiện tại."
  test: "<#BFC7D5>Thử cuộc thi với loại đã chọn."
  extend: "<#BFC7D5>Gia hạn cuộc thi đang diễn ra."
# Admin help (/emf admin help)
help-admin:
  title: "<#BFC7D5>Quản trị câu cá"
  bait: "<#BFC7D5>Trao mồi câu cho người chơi."
  competition: "<#BFC7D5>Quản lý cuộc thi câu cá."
  clearbaits: "<#BFC7D5>Gỡ toàn bộ mồi hợp lệ khỏi cần câu."
  fish: "<#BFC7D5>Trao cá cho người chơi."
  nbt-rod: "<#BFC7D5>Trao cần NBT dùng để câu cá EMF."
  custom-rod: "<#BFC7D5>Trao cần câu tùy chỉnh."
  reload: "<#BFC7D5>Tải lại cấu hình plugin."
  migrate: "<#BFC7D5>Chuyển cơ sở dữ liệu Legacy V2 sang V3."
  addons: "<#BFC7D5>Liệt kê addon đã đăng ký."
  version: "<#BFC7D5>Xem thông tin phiên bản plugin."
  rawitem: "<#BFC7D5>Xem NBT của vật phẩm đang cầm."
  database: "[noPrefix]Quản lý cơ sở dữ liệu plugin."
# Shown when the %emf_competition_place_player_*% placeholder requests a position in the leaderboard that doesn't exist
no-player-in-place: '<#BFC7D5>Hãy câu cá và chiếm lấy vị trí này đi!'
#Shown when the emf competition placeholders are used when there's no competition running
no-competition-running: '<#BFC7D5>Không có cuộc thi câu cá nào đang diễn ra.'
#How should the %emf_competition_place_fish_*% be formatted?
emf-competition-fish-format: '<white>{length}<#BFC7D5>cm <white>{rarity} {fish}'
#How should the %emf_competition_place_fish_*% be formatted when there's no length on the fish?
emf-lengthless-fish-format: '<white>{rarity_colour}{rarity}{fish}'
#How should %emf_competition_place_fish_*% be formatted during MOST/SPECIFIC_FISH competitions?
emf-most-fish-format: '<white>{amount}<#BFC7D5> con cá'
#What should be displayed for %emf_competition_place_size_*% during the MOST_FISH competition?
emf-size-during-most-fish: '<#FF5A6E>Không tồn tại'
#How the %emf_competition_time_left% variable should be formatted.
emf-time-remaining: '<#BFC7D5>Thời gian cho đến cuộc thi tiếp theo: <#5899ee>{days}<#BFC7D5> ngày <#5899ee>{hours}<#BFC7D5> giờ <#5899ee>{minutes}<#BFC7D5> phút.'
#Replaces the %emf_competition_time_left% variable when there's a competition already running.
emf-time-remaining-during-comp: '<#BFC7D5>Đang có cuộc thi câu cá diễn ra.'
#Sent when a player tries to apply too many types of baits to a fishing rod, set in the general section of baits.yml
max-baits-reached: '<#BFC7D5><reset>Bạn đã đạt đến mức độ tối đa của mồi câu cho cần câu này.'
#Not to be confused with the above, this is sent when the maximum of a specific bait is reached. Define this in baits.yml using "max-baits".
max-bait-reached: '<#BFC7D5><reset>Bạn đã đạt đến mức tối đa của mồi cầu <white>{bait}<#BFC7D5><reset> để có thể áp dụng vào cần câu.'
#Sent when a player catches a bait from fishing (this can be disabled by setting catch-percentage to 0 in baits.yml
bait-catch: '<#BFC7D5><reset><#57C7FF>{player}<#BFC7D5><reset> đã bắt được mồi câu <white>{bait}<#BFC7D5><reset>!'
#Sent when a bait is applied and a fish is caught.
bait-use: '<#BFC7D5><reset>Bạn đã dùng mồi <white>{bait}.'
#Sent when someone tries to use a bait in creative
bait-survival-limited: '<#BFC7D5><reset>Bạn phải ở <underlined>Sinh tồn<reset> để có thể áp dụng mồi câu.'
#Shown when /emf toggle is run, to turn off and on respectively.
toggle-off: '<#BFC7D5><reset>Bạn sẽ không bắt được cá nữa (Cá được custom).'
toggle-on: '<#BFC7D5><reset>Bạn sẽ bắt được cá (Cá được custom).'
#When trying to place a skull-fish when this is blocked in config.yml
place-fish-blocked: '<#FF5A6E><reset>Bạn không thể đặt loại cá này.'
admin:
  #Opens an /emf shop for another player
  open-fish-shop: '<#BFC7D5><reset>Mở shop cho <#57C7FF>{player}.'
  #When a fish is given to a player
  given-player-fish: '<#BFC7D5><reset>Bạn đã đưa người chơi <#57C7FF>{player}<#BFC7D5> con cá <white>{fish}.'
  #When a bait is given to a player
  given-player-bait: '<#BFC7D5><reset>Bạn đã đưa người chơi <#57C7FF>{player}<#BFC7D5> bait <white>{bait}.'
  #When an admin runs /emf admin bait without a bait name.
  no-bait-specified: '<#BFC7D5><reset>Tên loại mồi không tồi tại.'
  #When the admin tries the command /emf admin clearbaits whe not holding a fishing rod.
  must-be-holding-rod: '<#BFC7D5><reset>Bạn cần phải cầm cần câu trên tay.'
  #When /emf admin clearbaits command is run.
  all-baits-cleared: '<#BFC7D5><reset>Bạn đã loại bỏ <white>{amount}<#BFC7D5> mồi khỏi cần câu.'
  #/emf admin clearbaits is run, but there are no baits on the rod.
  no-baits-on-rod: '<#BFC7D5><reset>Cần câu này không có mồi.'
  #When economy is disabled for the plugin
  economy-disabled: '<#FF5A6E><reset>Tính năng tiền bạc của EvenMoreFish đã bị tắt.'
  #When the specified player can't be found when using -p: parameter.
  player-not-found: '<#FF5A6E><reset><#57C7FF>{player}<#FF5A6E> không tồn tại.'
  #When the specified number in -q: is not a number.
  number-format-error: '<#FF5A6E><reset><white>{amount}<#FF5A6E> không phải là con số.'
  #When the specified number in -q: is not within the minecraft stack range (1-64)
  number-range-error: '<#BFC7D5><reset><white>{amount}<#BFC7D5> phải là số từ 1-64.'
  #When a command cannot be run from the console
  cannot-run-on-console: '<#FF5A6E><reset>Lệnh này không thể gửi từ console.'
  #Sent when a competition is already running when using /emf admin competition start
  competition-already-running: '<#BFC7D5><reset>Đang có cuộc thi khác đang khởi động.'
  #When an invalid competition type is tried to be started
  competition-type-invalid: '<#FF5A6E><reset>Đó không phải xếp hạng cuộc thi đúng, các xếp hạng có sẵn: MOST_FISH, LARGEST_FISH, SPECIFIC_FISH'
  #When there's a modrinth update available, don't translate the URL otherwise it won't direct to the correct page.
  update-available: '<#55D68A><reset>Đã có cập nhật mới tại https://modrinth.com/plugin/evenmorefish/versions?l=paper'
  #When the plugin is reloaded
  reload: '<#55D68A><reset>Đã tải lại plugin hoàn tất.'

