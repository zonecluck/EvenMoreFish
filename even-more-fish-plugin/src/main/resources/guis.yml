# Configuration for all EMF GUIs.
# This file will soon be split into multiple, just like the rest of the configs.
# Inventory titles: optional inventory-title overrides title. {rows} is the actual
# chest layout height (1–6), and row_1..row_6 glyphs follow it automatically.
# Optional rows must match layout; omit it to derive the height from layout.
# Use pack glyphs only on servers that provide those glyphs. Item names are unchanged.

# An example button, to hopefully help with understanding what they can do.
# See the wiki for all item options: https://evenmorefish.github.io/EvenMoreFish/docs/configuration/items
button-example:
  item:
    material: diamond
    displayname: <gold>Example Button
    lore:
      - This is customizable lore.
      - Add whatever you want in here.
  character: c # The character to use inside the GUI layout configs.
  click-action:
    left: fish-toggle # The click action to execute on left click.
    right: full-exit # The click action to execute on right click.
  click-commands: # Optional commands for the player to execute on either click.
    - emf help

# These elements are available in every gui.
# They will only show up when pages are needed.
general:
  # Character: f
  first-page:
    item:
      material: arrow
      displayname: "<aqua><bold>Trang Đầu Tiên</bold></aqua>"
      lore:
        - ' '
        - '<dark_gray> ○ <white>Thao tác: <aqua>Trở về trang đầu tiên</aqua>'
        - ' '
        - '<#A8D8EA>Nhấp chuột <white>để chuyển về đầu!'
  # Character: p
  previous-page:
    item:
      material: paper
      displayname: "<yellow><bold>Trang Trước</bold></yellow>"
      lore:
        - ' '
        - '<dark_gray> ○ <white>Thao tác: <yellow>Quay lại trang trước</yellow>'
        - ' '
        - '<#A8D8EA>Nhấp chuột <white>để xem lại!'
  # Character: n
  next-page:
    item:
      material: paper
      displayname: "<yellow><bold>Trang Kế Tiếp</bold></yellow>"
      lore:
        - ' '
        - '<dark_gray> ○ <white>Thao tác: <yellow>Chuyển sang trang sau</yellow>'
        - ' '
        - '<#A8D8EA>Nhấp chuột <white>để xem tiếp!'
  # Character: l
  last-page:
    item:
      material: arrow
      displayname: "<aqua><bold>Trang Cuối Cùng</bold></aqua>"
      lore:
        - ' '
        - '<dark_gray> ○ <white>Thao tác: <aqua>Chuyển đến trang cuối cùng</aqua>'
        - ' '
        - '<#A8D8EA>Nhấp chuột <white>để xem cuối!'

