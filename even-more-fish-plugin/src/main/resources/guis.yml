# FISH JOURNAL

# The main menu for selecting the rarity you'd like to view
journal-menu:
  title: <#006F86>EvenMoreFish - Nhật Ký Bắt Cá
  layout:
    - "232323232"
    - "3rrrrrrr3"
    - "2rrrrrrr2"
    - "3rrrrrrr3"
    - "2rrrrrrr2"
    - "p323x323n"
  filler: GRAY_STAINED_GLASS_PANE
  # The character to use for rarity items
  rarity-character: r

  # How to sort the rarities. Valid options are: alphabetical, weight, index. (Default: index)
  sort-type: index

  # Whether to show the undiscovered-rarity config below when a rarity has not been discovered by the player.
  hide-undiscovered-rarity: false

  # How undiscovered rarities should look
  undiscovered-rarity:
    item:
      material: iron_bars
      displayname: "<dark_gray><bold>Phẩm Chất Chưa Mở Khóa</bold></dark_gray>"
      lore:
        - " "
        - "<dark_gray> ○ <white>Trạng thái: <red>Chưa mở khóa</red>"
        - " "
        - "<dark_gray> ○ <white><#C797FF>Hãy câu cá thuộc phẩm chất này"
        - "<dark_gray> ○ <white>để mở khóa nhật ký!"
  rarity-item:
    item:
      # This will be overwritten by the rarity's material.
      material: cod
      displayname: '{rarity}'
      lore:
        - ' '
        - '<dark_gray> ○ <white>Mục: <aqua>Xem danh mục cá đã câu</aqua>'
        - ' '
        - '<#A8D8EA>Nhấp chuột <white>để xem chi tiết!'

  exit:
    item:
      material: pufferfish
      displayname: "<red><bold>Thoát</bold></red>"
      lore:
        - ' '
        - '<dark_gray> ○ <white>Thao tác: <red>Đóng giao diện</red>'
        - ' '
        - '<#A8D8EA>Nhấp chuột <white>để thoát menu!'
    glowing: true
    character: x
    click-action: full-exit

  light_blue_stained_glass_pane-filler:
    item:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      displayname: ' '
      hide-tooltip: true
    character: '2'
    click-action: none
  cyan_stained_glass_pane-filler:
    item:
      material: CYAN_STAINED_GLASS_PANE
      displayname: ' '
      hide-tooltip: true
    character: '3'
    click-action: none

# The menu for the chosen rarity
journal-rarity:
  title: <dark_blue>Nhật Ký Bắt Cá
  layout:
    - "    a    "
    - " fffffff "
    - " fffffff "
    - " fffffff "
    - " fffffff "
    - "p   x   n"
  filler: "AIR"
  # The character to use for fish items
  fish-character: f

  # How to sort the fish. Valid options are: alphabetical, weight, index. (Default: alphabetical)
  sort-type: alphabetical

  # Whether to show the undiscovered-fish config below when a fish has not been caught by the player.
  hide-undiscovered-fish: false

  # The message to display when a fish has no data.
  # This does not support formatting.
  unknown-message: "Chưa rõ"

  # How undiscovered fish should look
  undiscovered-fish:
    item:
      material: iron_bars
      displayname: "<dark_gray><bold>Cá Chưa Mở Khóa</bold></dark_gray>"
      lore:
        - " "
        - "<dark_gray> ○ <white>Trạng thái: <red>Chưa bắt được</red>"
        - " "
        - "<dark_gray> ○ <white><#C797FF>Hãy thử vận may đi câu"
        - "<dark_gray> ○ <white>để mở khóa cá này!"
  fish-item:
    item:
      displayname: "<yellow><bold>{fishname}</bold></yellow>"
      lore:
        - ' '
        - '<dark_gray> ○ <white>Thành tích cá nhân:'
        - '  <dark_gray> -<white> Đã câu: <yellow>{times-caught} lần</yellow>'
        - '  <dark_gray> -<white> Lớn nhất: <green>{largest-size}cm</green>'
        - '  <dark_gray> -<white> Nhỏ nhất: <aqua>{smallest-size}cm</aqua>'
        - '  <dark_gray> -<white> Ngày phát hiện: <gold>{discover-date}</gold>'
        - ' '
        - '<dark_gray> ○ <white>Kỷ lục máy chủ:'
        - '  <dark_gray> -<white> Người đầu tiên: <light_purple>{discoverer}</light_purple>'
        - '  <dark_gray> -<white> Lớn nhất server: <green>{server-largest}cm</green>'
        - '  <dark_gray> -<white> Nhỏ nhất server: <aqua>{server-smallest}cm</aqua>'
        - '  <dark_gray> -<white> Tổng đã câu: <yellow>{server-caught} lần</yellow>'
        - ' '
        - '<#A8D8EA>Nhật ký sinh vật biển'
        - '<white>chi tiết của EvenMoreFish'

  rarity-item:
    item:
      displayname: "<white>{rarityname}</white>"

  info:
    item:
      material: book
      displayname: "<aqua><bold>Thông Tin Phẩm Chất</bold></aqua>"
      lore:
        - ' '
        - '<dark_gray> ○ <white>Mô tả: <yellow>Danh sách toàn bộ các loại cá</yellow>'
        - '<dark_gray> ○ <white>Phẩm chất: <white>Thuộc độ hiếm đang chọn</white>'
        - ' '
        - '<#A8D8EA>Theo dõi tiến trình'
        - '<white>để hoàn thành bộ sưu tập!'
    character: a

  exit:
    item:
      material: pufferfish
      displayname: "<red><bold>Quay Lại</bold></red>"
      lore:
        - ' '
        - '<dark_gray> ○ <white>Thao tác: <red>Trở về danh sách phẩm chất</red>'
        - ' '
        - '<#A8D8EA>Nhấp chuột <white>để quay lại!'
    glowing: true
    character: x
    click-action: open-journal-menu

